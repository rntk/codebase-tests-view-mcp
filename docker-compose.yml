version: '3.8'

services:
  codebase-view-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8380:8380"
    volumes:
      # Mount current directory for file browsing
      - .:/workspace:ro
      # Mount metadata storage (persistent)
      - ./metadata:/data
    environment:
      - PORT=8380
      - METADATA_PATH=/data/metadata.json
    command: ["/app/server", "-port", "8380", "-dir", "/workspace", "-metadata", "/data/metadata.json"]
    restart: unless-stopped
